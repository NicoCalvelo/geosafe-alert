server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API REST vers le backend AdonisJS
    location /api/ {
        proxy_pass http://ca-backend-geosafe-dev.lemonstone-91fbb678.spaincentral.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (Socket.io) vers le backend
    location /socket.io/ {
        proxy_pass http://ca-backend-geosafe-dev.lemonstone-91fbb678.spaincentral.azurecontainerapps.io;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket safe handling
        proxy_set_header Upgrade $http_upgrade;
    }

    # Angular HTML5 routing — renvoie index.html pour toutes les routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}