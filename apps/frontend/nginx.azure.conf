server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API REST vers le backend AdonisJS
    location ^~ /api/ {
        internal;

        proxy_pass https://${BACKEND_URL};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host ${BACKEND_URL};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (Socket.io) vers le backend
    location /socket.io/ {
        internal;

        proxy_pass https://${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host ${BACKEND_URL};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        # WebSocket is required by Socket.io. The Upgrade header is explicitly
        # restricted to websocket instead of forwarding the client-controlled value.
        proxy_set_header Upgrade websocket;

        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        # Required to establish the HTTP/1.1 WebSocket upgrade for Socket.io.
        proxy_set_header Connection "upgrade";
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /read {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}