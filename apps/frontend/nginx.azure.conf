server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API REST vers le backend AdonisJS
    location ^~ /api/ {
        proxy_pass https://ca-backend-geosafe-dev.happydesert-88e60ec2.spaincentral.azurecontainerapps.io;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host ca-backend-geosafe-dev.happydesert-88e60ec2.spaincentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (Socket.io) vers le backend
    location /socket.io/ {
        proxy_pass https://ca-backend-geosafe-dev.happydesert-88e60ec2.spaincentral.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ca-backend-geosafe-dev.happydesert-88e60ec2.spaincentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket safe handling
        proxy_set_header Upgrade $http_upgrade;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Angular HTML5 routing — renvoie index.html pour toutes les routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}