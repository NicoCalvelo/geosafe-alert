<div class="dashboard-layout">
  <!-- Sidebar -->
  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    (toggled)="toggleSidebar()"
    (filtersChanged)="onFiltersChanged()"
    (synced)="onSynced()"
    (zoneAlertSelected)="onZoneAlertClicked($event)"
  />

  <!-- Main area -->
  <div class="flex-1 relative">
    <!-- Search bar -->
    <app-search-bar (addressSelected)="onAddressSelected($event)" />

    <!-- Toggle sidebar button (visible when collapsed) -->
    @if (sidebarCollapsed()) {
      <button
        (click)="toggleSidebar()"
        class="absolute top-4 left-4 z-10 p-2 bg-slate-900/80 hover:bg-slate-800 text-white rounded-lg border border-slate-600/70 backdrop-blur-md transition-colors"
        title="Open sidebar"
      >
        ☰
      </button>
    }

    <!-- Loading indicator -->
    @if (loading()) {
      <div class="absolute top-4 left-1/2 -translate-x-1/2 z-10 px-4 py-2 bg-slate-900/80 border border-slate-600/70 text-white text-sm rounded-lg backdrop-blur-md shadow-xl">
        Loading alerts...
      </div>
    }

    <!-- Cesium Globe -->
    <app-cesium-viewer />

    <!-- Indices panel (shown after an address is selected) -->
    @if (indicesPanelVisible()) {
      <app-indices-panel
        [indices]="indices()"
        [loading]="indicesLoading()"
        [addressLabel]="selectedAddressLabel()"
        [zoneId]="selectedZoneId()"
        [subscribed]="selectedZoneId() ? subscribedZoneIds().has(selectedZoneId()!) : false"
        (closed)="onIndicesPanelClosed()"
        (indexHover)="onIndexHover($event)"
        (subscribeToggled)="onToggleSubscribe()"
      />
    }
  </div>
</div>

<!-- Toast notifications -->
<app-toast />
