<aside
  class="h-full bg-gray-800 border-r border-gray-700 flex flex-col transition-all duration-300 overflow-hidden"
  [class.w-72]="!collapsed()"
  [class.w-0]="collapsed()"
>
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-700 shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-xl">🌍</span>
      <h1 class="text-lg font-bold text-white whitespace-nowrap">GeoSafe</h1>
    </div>
    <div class="flex items-center gap-1">
      <button
        (click)="onSync()"
        [disabled]="syncing()"
        class="text-gray-400 hover:text-white transition-colors p-1 disabled:opacity-50"
        title="Sync alerts"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          [class.animate-spin]="syncing()"
        >
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
      </button>
      <button
        (click)="onToggle()"
        class="text-gray-400 hover:text-white transition-colors p-1"
        title="Collapse sidebar"
      >
        ✕
      </button>
    </div>
  </div>

  <!-- User info -->
  @if (user()) {
    <div class="px-4 py-3 border-b border-gray-700 shrink-0">
      <p class="text-sm text-white truncate">{{ user()!.email }}</p>
      <div class="flex items-center justify-between mt-0.5">
        <p class="text-xs text-gray-400 capitalize">{{ user()!.role }}</p>
        <a
          routerLink="/profile"
          class="text-xs text-blue-400 hover:text-blue-300 transition-colors"
        >My profile</a>
      </div>
    </div>
  }

  <!-- Filters -->
  <div class="px-4 py-3 border-b border-gray-700 shrink-0">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Alert types</h2>
    <div class="space-y-1.5">
      @for (type of alertTypes(); track type.code) {
        <label class="flex items-center gap-2 cursor-pointer group">
          <input
            type="checkbox"
            [checked]="isFilterActive(type.code)"
            (change)="onToggleFilter(type.code)"
            class="rounded border-gray-600 bg-gray-700 text-blue-500 focus:ring-blue-500 focus:ring-offset-0"
          />
          <span
            class="w-2.5 h-2.5 rounded-full shrink-0"
            [style.background-color]="type.color"
          ></span>
          <span class="text-sm text-gray-300 group-hover:text-white transition-colors">{{ type.label }}</span>
        </label>
      }
    </div>
  </div>

  <!-- Alert list -->
  <div class="flex-1 overflow-y-auto p-3 space-y-2">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Alerts</h2>
    @for (entity of entityList(); track entity.id) {
      <app-alert-card
        [entityId]="entity.id"
        [title]="entity.name"
        [alertLabel]="entity.label"
        [alertColor]="entity.color"
        [class.ring-1]="selectedEntityId() === entity.id"
        [class.ring-blue-500]="selectedEntityId() === entity.id"
        class="block rounded-lg"
        (clicked)="onAlertClick($event)"
      />
    } @empty {
      <p class="text-sm text-gray-500 text-center py-4">No alerts loaded</p>
    }
  </div>

  <!-- Logout -->
  <div class="p-4 border-t border-gray-700 shrink-0">
    <button
      (click)="onLogout()"
      class="w-full py-2 px-3 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-colors"
    >
      Sign out
    </button>
  </div>
</aside>
