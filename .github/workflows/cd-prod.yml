name: GeoSafe CD PROD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ${{ github.repository_owner }}/geosafe-frontend
  IMAGE_BACKEND: ${{ github.repository_owner }}/geosafe-backend

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # AZURE LOGIN OIDC
      # =========================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # =========================
      # ACR LOGIN
      # =========================
      - name: Login to ACR
        run: |
          az acr login \
            --name acrgeosafedev
      - name: Select subscription
        run: |
          az account set \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # =========================
      # FRONTEND
      # =========================
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile.azure
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:prod-${{ github.run_number }}


      # =========================
      # DEPLOY FRONTEND
      # =========================
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name ca-frontend-geosafe-prod \
            --resource-group rg-geosafe-prod \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest

      # =========================
      # BACKEND
      # =========================
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:prod-${{ github.run_number }}

      # =========================
      # DEPLOY BACKEND
      # =========================
      - name: Deploy Backend
        run: |
          az containerapp update \
            --name ca-backend-geosafe-prod \
            --resource-group rg-geosafe-prod \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest