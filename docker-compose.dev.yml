version: '3.8'

services:
  # ─────────────────────────────────────────
  # Base de données PostgreSQL + PostGIS
  # ─────────────────────────────────────────
  db:
    platform: linux/amd64
    build: ./geosafe-db
    container_name: geosafe_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: geosafe
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d geosafe']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Backend — AdonisJS (hot reload)
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: geosafe_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: '3333'
      HOST: '0.0.0.0'
      LOG_LEVEL: debug
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: root
      DB_PASSWORD: '123456'
      DB_DATABASE: geosafe
      SESSION_DRIVER: cookie
    volumes:
      - .:/app
      - /app/node_modules   # preserve container node_modules
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # pgAdmin
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: geosafe_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: 'admin@geosafe.com'
      PGADMIN_DEFAULT_PASSWORD: 'admin'
    ports:
      - '8080:80'
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Frontend — Angular (ng serve + proxy)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./geosafe-front
      dockerfile: Dockerfile.dev
    container_name: geosafe_frontend_dev
    restart: unless-stopped
    volumes:
      - ./geosafe-front:/app
      - /app/node_modules   # preserve container node_modules
    ports:
      - '4200:4200'
    depends_on:
      - backend

volumes:
  pg_data_dev:
