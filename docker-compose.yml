version: '3.8'

services:
  # ─────────────────────────────────────────
  # Base de données PostgreSQL + PostGIS
  # ─────────────────────────────────────────
  db:
    platform: linux/amd64
    build: ./geosafe-db
    container_name: geosafe_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: geosafe
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d geosafe']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Backend — AdonisJS
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geosafe_backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3333'
      HOST: '0.0.0.0'
      LOG_LEVEL: info
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: root
      DB_PASSWORD: '123456'
      DB_DATABASE: geosafe
      SESSION_DRIVER: cookie
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # pgAdmin
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: geosafe_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: 'admin@geosafe.com'
      PGADMIN_DEFAULT_PASSWORD: 'admin'
    ports:
      - '8080:80'
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Frontend — Angular (build + nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./geosafe-front
      dockerfile: Dockerfile
    container_name: geosafe_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pg_data:
