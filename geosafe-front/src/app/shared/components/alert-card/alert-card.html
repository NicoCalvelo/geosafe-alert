<button
  (click)="onClick()"
  class="w-full text-left p-3 rounded-lg bg-gray-700/50 hover:bg-gray-700 transition-colors cursor-pointer border-l-4"
  [style.border-left-color]="alertColor()"
>
  <div class="flex items-center gap-2">
    <span
      class="w-2.5 h-2.5 rounded-full shrink-0"
      [class.animate-pulse]="status() === 'active'"
      [style.background-color]="alertColor()"
    ></span>
    <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">{{ alertLabel() }}</span>
  </div>
  <p class="text-sm text-gray-200 mt-1 truncate">{{ title() }}</p>
</button>
