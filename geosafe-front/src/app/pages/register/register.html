<div class="flex items-center justify-center min-h-screen bg-gray-900">
  <div class="w-full max-w-md p-8 bg-gray-800 rounded-2xl shadow-xl">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">🌍 GeoSafe</h1>
      <p class="text-gray-400 mt-2">Create your account</p>
    </div>

    <!-- Error -->
    @if (error()) {
      <div class="mb-4 p-3 bg-red-900/50 border border-red-500 rounded-lg text-red-300 text-sm">
        {{ error() }}
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="fullName" class="block text-sm font-medium text-gray-300 mb-1">Full name</label>
        <input
          id="fullName"
          type="text"
          [(ngModel)]="fullName"
          name="fullName"
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="John Doe"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="8"
          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Min. 8 characters"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition-colors"
      >
        {{ loading() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="text-center text-gray-400 mt-6 text-sm">
      Already have an account?
      <a routerLink="/login" class="text-blue-400 hover:text-blue-300 font-medium">Sign in</a>
    </p>
  </div>
</div>
