services:
  db:
    build:
      context: ../../
      dockerfile: infrastructure/docker/db/Dockerfile.dev

    container_name: geosafe_db_dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: geosafe

    ports:
      - "5432:5432"

    volumes:
      - pg_data_dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d geosafe"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend/Dockerfile.dev

    container_name: geosafe_backend_dev

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ../../:/app
      - pnpm-store:/pnpm/store

    env_file:
      - ../../env/.env.development

    environment:
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
      NODE_ENV: development

    ports:
      - "3333:3333"

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "
      pnpm install --force &&
      pnpm --filter geosafe-back dev
      "

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/frontend/Dockerfile.dev

    container_name: geosafe_frontend_dev

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ../../:/app
      - pnpm-store:/pnpm/store

    ports:
      - "4200:4200"

    environment:
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

    command: >
      sh -c "
      pnpm install --force &&
      pnpm --filter geosafe-front start --host 0.0.0.0
      "

  pgadmin:
    image: dpage/pgadmin4

    container_name: geosafe_pgadmin_dev

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@geosafe.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8080:80"

    depends_on:
      - db

volumes:
  pg_data_dev:
  pnpm-store: