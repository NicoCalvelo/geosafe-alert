  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/frontend/Dockerfile.dev

    container_name: geosafe_frontend_dev

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ../../:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "4200:4200"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

    command: >
      sh -c "
      pnpm install &&
      pnpm --filter geosafe-front start --host 0.0.0.0
      "

  pgadmin:
    image: dpage/pgadmin4

    container_name: geosafe_pgadmin_dev

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@geosafe.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8080:80"

    depends_on:
      - db

volumes:
  pg_data_dev:
  backend_node_modules:
  frontend_node_modules: