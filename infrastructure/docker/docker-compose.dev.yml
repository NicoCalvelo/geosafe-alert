services:
  db:
    build:
      context: ../../
      dockerfile: infrastructure/docker/db/Dockerfile.dev

    container_name: geosafe_db_dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: geosafe

    ports:
      - "5432:5432"

    volumes:
      - pg_data_dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d geosafe"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend/Dockerfile.dev

    container_name: geosafe_backend_dev

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ../../:/app
      - backend_node_modules:/app/node_modules

    env_file:
      - ../../env/.env.development

    environment:
      NODE_ENV: development

    ports:
      - "3333:3333"

    depends_on:
      db:
        condition: service_healthy
